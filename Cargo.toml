[package]
name = "secretbase"
version = "0.1.0"
edition = "2024"
description = "TUI for the Keybase CLI"

[dependencies]
ratatui = "0.30.0"
crossterm = "0.29.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
color-eyre = "0.6"
figlet-rs = "0.1"
zeroize = { version = "1", features = ["derive"] }
# Local timezone-aware timestamps for the chat (clock only — no default
# features, so no oldtime/serde bloat).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
emojis = "0.9.0"
# Syntax highlighting for fenced code blocks. Pure-Rust build: `regex-fancy`
# (no oniguruma C FFI) + miniz_oxide-backed dump-load, so it stays compatible
# with `#![forbid(unsafe_code)]` and needs no system libraries.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "default-themes",
    "regex-fancy",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
